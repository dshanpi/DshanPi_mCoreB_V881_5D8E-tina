
#kernel command arguments
earlyprintk=sunxi-uart,0x02500000
initcall_debug=1
console=ttyS0,115200
dtbo_idx=0
dtbo_part_name=dtbo
nand_root=ubi0_4
mmc_root=/dev/mmcblk0p7
nor_root=/dev/mtdblock1
init=/init
loglevel=8

coherent_pool=16K
cma=8M
#reserve_list=30M@64M,78M@128M,200M@512M
mac=
wifi_mac=
bt_mac=
specialstr=
root_partition=rootfs
mtd_name=sys
rootfstype=squashfs
dynamic_debug=
#set kernel cmdline if boot.img or recovery.img has no cmdline we will use this
setargs_nor=setenv bootargs  earlyprintk=${earlyprintk} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nor_root} rootwait init=${init} partitions=${partitions} cma=${cma} coherent_pool=${coherent_pool} ion_carveout_list=${reserve_list} dyndbg=${dynamic_debug} snum=${snum}
setargs_nand=setenv bootargs earlyprintk=${earlyprintk} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel}  ubi.mtd=${mtd_name} root=${nand_root} rootfstype=${rootfstype} rootwait init=${init} partitions=${partitions} cma=${cma} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} selinux=${selinux} specialstr=${specialstr} coherent_pool=${coherent_pool} ion_carveout_list=${reserve_list} dyndbg=${dynamic_debug}
setargs_nand_ubi=setenv bootargs ubi.mtd=${mtd_name} earlyprintk=${earlyprintk} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${nand_root} rootfstype=${rootfstype} init=${init} partitions=${partitions} cma=${cma} snum=${snum} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} specialstr=${specialstr} gpt=1 dyndbg=${dynamic_debug}
setargs_mmc=setenv bootargs earlyprintk=${earlyprintk} clk_ignore_unused initcall_debug=${initcall_debug} console=${console} loglevel=${loglevel} root=${mmc_root}  rootwait init=${init} partitions=${partitions} cma=${cma} mac_addr=${mac} wifi_mac=${wifi_mac} bt_mac=${bt_mac} selinux=${selinux} specialstr=${specialstr} coherent_pool=${coherent_pool} ion_carveout_list=${reserve_list} dyndbg=${dynamic_debug}
#nand command syntax: sunxi_flash read address partition_name read_bytes
#0x4007f800 = 0x40080000(kernel entry) - 0x800(boot.img header 2k)
boot_partition=boot
boot_normal=sunxi_flash read 44800000 ${boot_partition};bootm 44800000 ${sunxi_ramd_addr} ${sunxi_fdt_addr}
boot_recovery=sunxi_flash read 44800000 extend;bootm 44800000
boot_fastboot=fastboot
#recovery key
recovery_key_value_max=0x13
recovery_key_value_min=0x10
#fastboot key
fastboot_key_value_max=0x8
fastboot_key_value_min=0x2

sunxi_load_addr=0x44800000
sunxi_ramd_addr=0x44800000
sunxi_fdt_addr=
fdt_high=0x42000000

kernel_start_blk=
kernel_blk_count=

#uboot system env config
bootdelay=1
#default bootcmd, will change at runtime according to key press
boot_kernel=mmc read ${sunxi_load_addr} ${kernel_start_blk} ${kernel_blk_count};bootm ${sunxi_load_addr} ${sunxi_ramd_addr} ${sunxi_fdt_addr}
sunxicmd=run setargs_mmc
sunxi_pre_cmd=${sunxicmd};sunxi_update

preboot=sunxi_get_kern_env;sunxi_preboot
bootcmd=run sunxi_pre_cmd boot_normal
#verify the kernel
verify=N
